name = "boxpace-calendar-cron"
main = "index.js"
compatibility_date = "2026-01-01"

[triggers]
crons = ["0 * * * *"]   # every hour, on the hour (UTC)

[vars]
SITE_URL = "https://REPLACE-WITH-YOUR-SITE.pages.dev"
# CRON_SECRET is a secret: set it with `npx wrangler secret put CRON_SECRET` or in the dashboard. Never write it here.
